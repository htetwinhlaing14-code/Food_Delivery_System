<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Home Page</title>
        <style>
            * {
                margin: 0;
                box-sizing: border-box;
            }

            body {
                background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('Food Photo/Delibg.jpg');
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                padding-bottom: 90px;
                font-family: Arial, sans-serif;
            }

            .nav {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                box-shadow: 5px 8px 10px rgba(0, 0, 0, 0.1);
                height: 70px;
                background-color: bisque;
                z-index: 1000;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0 20px;
            }

            .logo {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 20px;
                font-weight: bold;
                font-family: 'Courier New', Courier, monospace;
                color: #333;
                cursor: pointer;
            }

            .logo-icon {
                width: 38px;
                height: 38px;
                background-color: #ff7043;
                color: white;
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 20px;
                box-shadow: 0px 3px 6px rgba(255, 112, 67, 0.4);
            }

            .nav ul {
                list-style: none;
                display: flex;
            }

            .nav ul li {
                padding: 0 15px;
            }

            .nav ul li a {
                text-decoration: none;
                color: black;
                cursor: pointer;
                font-size: 28px;
                font-weight: bold;
            }

            .nav ul li a:hover {
                text-decoration: underline;
                color: #ff7043;
            }

            .alt {
                color: black;
                text-align: center;
                padding: 10px;
                width: 100%;
                font-size: 16px;
                position: fixed;
                bottom: 0;
                left: 0;
                background-color: #fffaf0;
            }

            .text1 {
                font-size: 46px;
                font-family: 'Courier New', Courier, monospace;
                text-align: center;
                padding: 20px;
                font-weight: bold;
                margin-top: 110px; 
                color: white;
                text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.8);
            }

            .text2 {
                padding: 10px;
                text-align: center;
                font-size: 28px;
                color: #fdf5e6;
                text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
                margin-bottom: 20px;
            }

            .location {
                width: 400px;
                height: 55px;
                padding: 0 20px;
                font-size: 18px;
                border: 2px solid #ffcca1;
                border-radius: 30px;
                box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.4);
                outline: none;
                background-color: rgba(255, 255, 255, 0.95);
            }

            .bowl-img {
                width: 550px;
                height: 550px;
                box-shadow: 4px 6px 20px rgba(0, 0, 0, 0.6);
                padding: 12px;
                border-radius: 45px;
                object-fit: cover;
                background-color: white;
                margin-top: 20px;
            }
        </style>
    </head>
    <body>
        
        <div class="nav">
            <div class="logo">
                <div class="logo-icon">🍔</div>
                <span>Food for Foodie</span>
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="login page.html" class="logout-btn">Log Out</a></li>
            </ul>
        </div>
        
        <p class="text1">
            Delicious Foods,<br>Delivered to your Doorstep.
        </p>

        <p class="text2">
            Discover local top-rated restaurants and delicious menus.
        </p>

        <center>
            <input class="location" type="text" placeholder="Enter your delivery address 📍">
        </center> 
        <br>

        <center>
            <img class="bowl-img" src="Food Photo/bowl.avif" alt="Delicious Food">
        </center> 
        
        <br>

        <div class="alt">
            &copy; Developed By Htet Hlaing Win (Batch6-26).
        </div>

    </body>
</html>
